# Overlay: `--verify` — the applications built from their own Dockerfiles.
#
# Selected by `scripts/svc up <ticket> ... --verify [--build]`.
#
# DOCKER.md §5: a ticket's Definition of Done is satisfied, for anything that
# runs a service, only by the form where the apps run AS THEIR IMAGES. The
# container-specific failures — signal handling on shutdown, DNS between
# services, file paths, env resolution, non-root permissions, NODE_ENV — are
# invisible when the app runs outside its image and surface at deploy time,
# which under this plan is the worst possible moment because there is no
# staging environment to catch them.
#
# ---------------------------------------------------------------------------
# EVERY SERVICE HERE IS AN OVERRIDE, NOT AN ADDITION — AND THE DIFFERENCE IS
# ENFORCED (QA-F5).
#
# All five names below already exist in compose.yml with a profile, a
# mem_limit, a cpus and a networks: key. This file adds only `build:` and the
# handful of settings that differ when the app is its image rather than a
# stock one.
#
# `gate:egress-boundary` now distinguishes the two cases by a NAME-SET
# DIFFERENCE: a service present here but ABSENT from compose.yml is an
# ADDITION, and an addition must declare `networks:` exactly as a base service
# does. An override may leave networks alone because compose merges the base
# definition's. Before that change, a service defined only here with no
# networks: key passed the gate, came up healthy, and completed a TCP
# connection to 1.1.1.1:443 — QA measured it on T-017.
#
# So: prefer an override. If you genuinely need a service that exists nowhere
# else, it must carry `networks: [kinvara-int]`, an `image:` or a `build:`,
# and — because an overlay may not escape the DOCKER.md §3 budget table — a
# `mem_limit` and `cpus` that a profile in that table accounts for.
#
# DO NOT ADD A `ports:` KEY TO ANY SERVICE HERE. A ticket-scoped project
# publishes NO host port at all — not fixed, and not ephemeral either.
# compose.yml has no `ports:` key anywhere; it uses `expose:`, which documents
# a port without publishing it.
#
# This is the amended DOCKER.md §4.1(2), and it is not a style preference: a
# container attached only to an `internal: true` network CANNOT publish a host
# port. Docker drops it silently — no error, no warning (measured on Docker
# 29.7.1 / Compose v5.3.1, recorded as OD-4). A `ports:` line added here would
# therefore do nothing at all on a ticket project, while reading as though it
# worked, and it would take effect the moment someone gave a service a second
# non-internal network — which is how a fixed host port becomes a flaky test in
# another agent's ticket. `gate:app-images` fails on a `ports:` key here.
#
# The apps are reached the way everything else is: by compose service name on
# their default port (core:3000, web:3001), from a process running under
# `scripts/svc run`, which is on the network with them. Playwright and
# Lighthouse included — they run in the toolbox, not on the host.
#
# ---------------------------------------------------------------------------
# THE BUILD ARGS ARE DERIVED, NOT WRITTEN DOWN.
#
# `KINVARA_NODE_VERSION` and `KINVARA_PNPM_VERSION` are exported by
# `scripts/svc up ... --verify` from .tool-versions, the single source of truth
# (DOCKER.md §4.2). The `:?` form means a plain `docker compose -f ...` run
# fails with that message instead of silently building against some other Node
# — which is OD-1's shape, and the reason the image tag carries a fingerprint
# of the whole pin file.
#
# docker/app.Dockerfile is ONE file for all five, parameterised by APP. Read
# its header for why that is not laziness.
#
# THE REPETITION BELOW IS DELIBERATE, AND THE REASON CHANGED IN T-037 — the
# original reason is retired and this is what replaced it. Both halves of the
# old wording are now false and are struck rather than reworded:
#
#   ~~"YAML 1.2 (the `yaml` package the gate uses) does NOT resolve `<<`,
#     while compose's own Go parser (YAML 1.1) does"~~
#
#   * the GATE now resolves merge keys. `scripts/gates/lib/compose-parse.ts`
#     is the one place any gate reads a compose file, and it models `<<`
#     deliberately, so that a build reached through a fragment is subject to
#     every per-build rule (decisions.md OD-39). Negative case 72 is a build
#     merged in and refused; case 74 is a harmless merge that must stay green.
#     An anchor here would no longer buy any divergence for `<<`.
#   * the VERSION IDENTITY was wrong. Compose is not "YAML 1.1": measured with
#     `docker compose config`, it resolves `<<` (1.1's behaviour), reads
#     `A: on` as the STRING 'on' (1.2's) and `B: 0777` as 511 (1.1's) — it
#     splits within one document. Withdrawn at its origin, T-017 §R3, by
#     signed orchestrator correction; this was the copy in app/.
#     T-130 § Published contract §0 is the authority for what this gate's
#     reader models and what it refuses. (T-037's contract never merged —
#     T-037 was retired under OE-11 and the reader re-cut as T-130.)
#
# WHAT SURVIVES, AND IT IS WHY THE REPETITION STAYS — measured against
# compose, not argued: `<<` IS A SHALLOW MERGE. A child `args:` map REPLACES
# the parent's; it does not extend it. Probe, resolved by `docker compose
# config`:
#
#     x-build: &build   ->   args: {NODE_VERSION: ..., PNPM_VERSION: ...}
#     a.build           ->   {<<: *build, args: {APP: a}}
#     b.build           ->   {<<: *build}
#
#     resolved:
#       a.build.args = {APP: a}                    <- THE PINS ARE GONE
#       b.build.args = {NODE_VERSION, PNPM_VERSION}
#
# Every one of the five services below must declare its own `args:` for APP,
# APP_KIND and APP_PORT. So an anchor could not carry NODE_VERSION and
# PNPM_VERSION for any of them: it would save three lines (context,
# dockerfile, target) and make the two lines that matter most — the pins,
# derived from .tool-versions — LOOK inherited while every service silently
# built without them. That is not hypothetical and it is not unguarded:
# gate:app-images requires every service to pass each pin ARG its Dockerfile
# declares as the `:?` form, per service and not per file (OD-23, negative
# cases 37 and 38), so the anchor turns the gate red — measured on the
# anchored form of THIS file: exit 1, ten problems, two per service, each one
# naming a pin the merge dropped. The repetition stays because it is honest
# about a merge that does not do what it looks like it does, not because the
# gate cannot read it.
# ---------------------------------------------------------------------------

services:
  core:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
      target: runtime
      args:
        NODE_VERSION: ${KINVARA_NODE_VERSION:?derived from .tool-versions by scripts/svc}
        PNPM_VERSION: ${KINVARA_PNPM_VERSION:?derived from .tool-versions by scripts/svc}
        APP: core
        APP_KIND: http
        APP_PORT: '3000'
    pull_policy: build

  worker:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
      target: runtime
      args:
        NODE_VERSION: ${KINVARA_NODE_VERSION:?derived from .tool-versions by scripts/svc}
        PNPM_VERSION: ${KINVARA_PNPM_VERSION:?derived from .tool-versions by scripts/svc}
        APP: worker
        # A worker has no port, so its liveness is a heartbeat file and the
        # image's HEALTHCHECK asserts its freshness. Giving it an HTTP port
        # purely to be checkable would be a service surface that does not
        # exist in the deployed estate (T-003 runs it as an ECS task with no
        # load balancer).
        APP_KIND: worker
    pull_policy: build

  safety-gw:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
      target: runtime
      args:
        NODE_VERSION: ${KINVARA_NODE_VERSION:?derived from .tool-versions by scripts/svc}
        PNPM_VERSION: ${KINVARA_PNPM_VERSION:?derived from .tool-versions by scripts/svc}
        APP: safety-gw
        APP_KIND: http
        APP_PORT: '3010'
    pull_policy: build

  web:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
      target: runtime
      args:
        NODE_VERSION: ${KINVARA_NODE_VERSION:?derived from .tool-versions by scripts/svc}
        PNPM_VERSION: ${KINVARA_PNPM_VERSION:?derived from .tool-versions by scripts/svc}
        APP: web
        APP_KIND: http
        APP_PORT: '3001'
    pull_policy: build

  admin:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
      target: runtime
      args:
        NODE_VERSION: ${KINVARA_NODE_VERSION:?derived from .tool-versions by scripts/svc}
        PNPM_VERSION: ${KINVARA_PNPM_VERSION:?derived from .tool-versions by scripts/svc}
        APP: admin
        APP_KIND: http
        APP_PORT: '3002'
    pull_policy: build
