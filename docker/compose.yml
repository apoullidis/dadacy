# Kinvara — the local runtime (DOCKER.md §2, §3, §7, §9).
#
# THIS FILE IS NEVER RUN DIRECTLY. Use scripts/svc, which supplies the project
# name (-p kinvara-<ticket>), the overlays and the profile flags:
#
#   scripts/svc up   T-062 db
#   scripts/svc run  T-062 -- pnpm --filter core test:integration
#   scripts/svc down T-062
#
# Four properties this file is responsible for, each of which has bitten a
# programme like this one before:
#
#   1. EVERY service sits behind a profile. Nothing starts unless its profile
#      is named (DOCKER.md §3). There is no `all` profile and none may be added.
#
#   2. EVERY service is on `kinvara-int`, which is `internal: true`. No
#      application container and no fake has a route off this host. That is
#      what makes "no live vendor credentials" structural rather than a rule
#      somebody has to remember (DOCKER.md §7).
#      NO SERVICE IN THIS FILE IS EVER ATTACHED TO `kinvara-build`. T-017's
#      boundary check greps for exactly that.
#
#   3. NO HOST PORTS AT ALL on a ticket-scoped project. Not fixed ones, and —
#      after measurement — not ephemeral ones either. `expose:` documents the
#      port; nothing is published.
#
#      DOCKER.md §4.1 assumed ephemeral host ports here. THEY CANNOT EXIST
#      ALONGSIDE §7'S `internal: true` NETWORK: Docker silently drops port
#      publishing for a container attached only to an internal network. Not an
#      error, not a warning — `docker port` simply returns nothing (measured on
#      Docker 29.7.1 / Compose v5.3.1; recorded as OD-4).
#
#      Given the two, the internal network wins and it is not close. It is what
#      makes "no live vendor credentials" structural rather than remembered
#      (PROTOCOL.md §9.9, platform-infrastructure.md non-negotiable 5). The
#      ephemeral-port rule exists to stop two parallel agents colliding, and
#      publishing nothing satisfies that more completely than publishing
#      randomly: two projects cannot collide on a port neither has.
#
#      Nothing is lost, because nothing was reaching a ticket's services
#      through a host port anyway. Under `scripts/svc run` your process is ON
#      this network and addresses a service by its COMPOSE SERVICE NAME on its
#      DEFAULT PORT — postgres:5432, valkey:6379, core:3000. That covers every
#      test, every gate, Playwright and Lighthouse. `scripts/svc exec` covers
#      an interactive poke. The browser case — Mailpit's UI, Jaeger's UI — is
#      what the shared `kinvara-dev` stack is for, and compose.dev.yml is the
#      single documented place where a host port exists at all.
#
#   4. EVERY service declares `mem_limit` and `cpus`, and the numbers match the
#      budget table in DOCKER.md §3 exactly. The orchestrator sums that table
#      before dispatching a wave; if this file disagrees with it, the
#      arithmetic that keeps a 4-core / 15 GB machine alive is wrong.
#
# Budget reconciliation against DOCKER.md §3 (RAM per PROFILE):
#   db 512  = postgres 512
#   cache 64 = valkey 64
#   aws 1024 = localstack 1024
#   pay 128  = stripe-mock 128
#   tel 128  = fake-telephony 128
#   mail 64  = mailpit 64
#   hibp 64  = hibp-fake 64
#   otel 512 = otel-collector 192 + jaeger 320
#   api 768  = core 768
#   worker 512 = worker 512
#   safety 256 = safety-gw 256
#   web 768  = web 768
#   admin 768 = admin 768
# `cpus` is a share of the 4 available cores; it is a ceiling, not a
# reservation, so the sums may exceed 4.

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  # Compose names this `<project>_kinvara-int`, so every ticket gets its own
  # isolated one. `internal: true` means no default gateway: a container here
  # cannot reach the internet, and neither can a test process attached to it.
  kinvara-int:
    internal: true
    labels:
      io.kinvara.network: int
      io.kinvara.egress: denied

# ---------------------------------------------------------------------------
# Volumes — all project-scoped, all destroyed by `scripts/svc down`.
# ---------------------------------------------------------------------------
volumes:
  pgdata:
    labels: { io.kinvara.volume: pgdata }
  valkeydata:
    labels: { io.kinvara.volume: valkeydata }
  localstackdata:
    labels: { io.kinvara.volume: localstackdata }

services:
  # =========================================================================
  # profile: db — Postgres 18 + PostGIS 3.6, DERIVED (T-017)
  #
  # THE PINNED POSTGRES IMAGE. Testcontainers (T-115) and every migration
  # ticket must use this exact tag; it is published in T-017's contract and
  # nothing else declares it (DOCKER.md §1).
  #
  # It is `kinvara/postgres:18-3.6-kinvara1`, built here from
  # docker/postgres.Dockerfile, NOT `postgis/postgis:18-3.6` directly. T-016
  # used the base image; four defects were then found against it while landing
  # T-020's 0001 migration, and three of the four are unrepairable after
  # `CREATE DATABASE`:
  #
  #   OD-5  libc collation where SD §DB-16 requires ICU `und` deterministic
  #   OD-6  no pg_partman, and no route to fetch it (kinvara-int is internal)
  #   OD-7  empty shared_preload_libraries — pg_stat_statements half-installs
  #   OD-8  the base image auto-created four undeclared extensions, leaving
  #         13 PUBLIC-readable relations that 0001 never names
  #
  # THE FIXES LIVE IN THE DOCKERFILE, NOT HERE, and that is deliberate: T-115
  # starts this image through Testcontainers with compose.yml nowhere in the
  # picture, so a setting that only exists in this file is a setting the
  # constraint suites do not get. Read docker/postgres.Dockerfile for the
  # whole story. There is no POSTGRES_INITDB_ARGS below for that reason —
  # the image sets it, and repeating it here would be two places to drift.
  #
  # The Debian-based variant is deliberate, not the -alpine one: the Greek
  # collation and text-search behaviour T-098 checks depends on the ICU and
  # snowball build, and Debian is what RDS is closest to.
  # =========================================================================
  postgres:
    image: kinvara/postgres:18-3.6-kinvara1
    build:
      context: '.'
      dockerfile: postgres.Dockerfile
    profiles: ['db']
    networks: [kinvara-int]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-kinvara}
      TZ: UTC
      PGTZ: UTC
    expose:
      - '5432' # documented, NOT published — see note 3 in the header
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data. Postgres 18 images
      # store data in a major-version-specific subdirectory so that
      # `pg_upgrade --link` does not cross a mount boundary
      # (docker-library/postgres#1259). Mounting the old 17-and-earlier path
      # makes the container exit 1 at startup with "there appears to be
      # PostgreSQL data in: /var/lib/postgresql/data (unused mount/volume)".
      # Measured here, not guessed. T-115's Testcontainers harness reuses this
      # image tag and must use the same path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-kinvara}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 10s

  # =========================================================================
  # profile: cache — Valkey
  # 8.1 rather than 9.x: ElastiCache is the T-019 counterpart and 8.1 is what
  # it offers. A local stand-in ahead of the managed service is drift.
  # =========================================================================
  valkey:
    image: valkey/valkey:8.1-alpine
    profiles: ['cache']
    networks: [kinvara-int]
    command:
      - valkey-server
      - --save
      - ''
      - --appendonly
      - 'no'
      # Bound below the 64 MB cgroup limit so Valkey evicts rather than being
      # OOM-killed. A cache that dies is a different failure from a cache that
      # is full, and only one of them is the one we want to test.
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - allkeys-lru
    expose:
      - '6379'
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 5s

  # =========================================================================
  # profile: aws — LocalStack (S3, KMS, Secrets Manager, SES)
  #
  # SEEDED BY ./fakes/seed (T-017). Two read-only mounts, deliberately:
  #
  #   ready.d/  -> /etc/localstack/init/ready.d   LocalStack runs these once,
  #                                               after it reports ready.
  #   lib/      -> /opt/kinvara/seed              the manifest and the verifier,
  #                                               which must NOT be executed as
  #                                               init hooks.
  #
  # The manifest is the single source of truth for the five buckets (SA DA-12),
  # the CMK set and the secret set, and the SAME file is read by the verifier,
  # so the seed and the check cannot drift apart:
  #
  #   scripts/svc exec <ticket> localstack /opt/kinvara/seed/verify.sh
  # =========================================================================
  localstack:
    image: localstack/localstack:4.9
    profiles: ['aws']
    networks: [kinvara-int]
    environment:
      SERVICES: s3,kms,secretsmanager,ses
      DEBUG: '0'
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-central-1}
      # LocalStack must not phone home; it is on an internal network and would
      # only produce noisy timeouts if it tried.
      DISABLE_EVENTS: '1'
      SKIP_SSL_CERT_DOWNLOAD: '1'
      # Where the ready-hook finds the manifest and the verifier.
      SEED_LIB: /opt/kinvara/seed
    expose:
      - '4566'
    volumes:
      - localstackdata:/var/lib/localstack
      - ./fakes/seed/ready.d:/etc/localstack/init/ready.d:ro
      - ./fakes/seed/lib:/opt/kinvara/seed:ro
    healthcheck:
      # BOTH conditions, on purpose. LocalStack reports healthy before the
      # ready-hook has finished seeding, so a healthcheck on its own endpoint
      # returns while the account is half-populated and `svc up` hands the
      # agent a race. /tmp/kinvara-seed-complete is written by 10-seed.sh only
      # AFTER verify.sh has passed, so "healthy" here means "seeded and
      # verified". A failing seed never writes it and `svc up` times out
      # loudly rather than succeeding against a half-seeded account.
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:4566/_localstack/health >/dev/null && test -f /tmp/kinvara-seed-complete',
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    mem_limit: 1024m
    cpus: 1.0

  # =========================================================================
  # profile: pay — stripe-mock
  # =========================================================================
  stripe-mock:
    image: stripe/stripe-mock:v0.194.0
    profiles: ['pay']
    networks: [kinvara-int]
    expose:
      - '12111'
    mem_limit: 128m
    cpus: 0.5

  # =========================================================================
  # profile: tel — fake-telephony (ours)
  # T-017 builds this image from ./fakes/telephony. It is declared now so the
  # profile name, service name, port and budget are fixed and every ticket's
  # `svc` column can be written against them.
  # It returns 501 Not Implemented on every inbound-SMS route (SA §INT-5r) —
  # a fake never exceeds the real thing's capability (DOCKER.md §8).
  # =========================================================================
  fake-telephony:
    image: kinvara/fake-telephony:dev
    build:
      context: ./fakes/telephony
      dockerfile: Dockerfile
    profiles: ['tel']
    labels:
      io.kinvara.built-by: 'T-017'
      io.kinvara.built-by-title: 'the vendor fake containers'
    networks: [kinvara-int]
    environment:
      PORT: '4000'
      # Unset by default. A ticket that wants webhooks delivered points this at
      # a service on this same internal network, e.g. http://safety-gw:3010.
      # When unset, every webhook is still RECORDED with delivery
      # `not_configured`, so a test can still assert the fake tried.
      TELEPHONY_WEBHOOK_BASE: ${TELEPHONY_WEBHOOK_BASE:-}
      # The number WE own and forward to the answering-service vendor, so the
      # 15-minute acknowledgement clock starts at our webhook rather than at
      # the vendor's report (EV-1).
      TELEPHONY_SAFETY_LINE: ${TELEPHONY_SAFETY_LINE:-+35722000199}
      # Alphanumeric sender IDs are fully supported in Cyprus with no
      # pre-registration (SA INT-5r) — one of the few things this market makes
      # easier rather than harder.
      TELEPHONY_SENDER_ID: ${TELEPHONY_SENDER_ID:-Kinvara}
    expose:
      - '4000'
    mem_limit: 128m
    cpus: 0.5
    stop_grace_period: 5s

  # =========================================================================
  # profile: mail — Mailpit
  # =========================================================================
  mailpit:
    image: axllent/mailpit:v1.28
    profiles: ['mail']
    networks: [kinvara-int]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    expose:
      - '1025' # SMTP
      - '8025' # web UI + assertion API
    mem_limit: 64m
    cpus: 0.25

  # =========================================================================
  # profile: hibp — hibp-fake (ours), T-139, stakeholder ruling OE-22
  # The HIBP Pwned Passwords k-anonymity RANGE API stand-in. It answers only
  # `GET /range/<5 hex>` over a small synthetic corpus and refuses anything
  # wider than the real API accepts (PROTOCOL §9 item 11, DOCKER.md §8). No
  # /healthz: the real API has none, so the healthcheck asks for a range.
  # =========================================================================
  hibp-fake:
    image: kinvara/hibp-fake:dev
    build:
      context: ./fakes/hibp
      dockerfile: Dockerfile
    profiles: ['hibp']
    labels:
      io.kinvara.built-by: 'T-139'
      io.kinvara.built-by-title: 'the HIBP range-API stand-in'
    networks: [kinvara-int]
    environment:
      PORT: '4100'
    expose:
      - '4100'
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 5s

  # =========================================================================
  # profile: otel — collector + Jaeger (T-008 owns the collector config)
  # =========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    profiles: ['otel']
    networks: [kinvara-int]
    # T-008. The config is the SECOND of SA §TS-10 rule 1's three redaction
    # points, and it is an ALLOWLIST (`allow_all_keys: false`). Read
    # docker/otel-collector.yaml before changing anything here.
    command: ['--config=/etc/kinvara/otel-collector.yaml']
    volumes:
      - ./otel-collector.yaml:/etc/kinvara/otel-collector.yaml:ro
    expose:
      - '4317' # OTLP gRPC
      - '4318' # OTLP HTTP
    healthcheck:
      # The collector image has no shell and no curl. Its OTLP/HTTP receiver
      # answers a malformed POST with 400 and a valid empty payload with 200,
      # so a TCP connect is the strongest probe available without adding a
      # tool to a pinned upstream image. `nc` is absent too; Go's own
      # `--feature-gates` healthcheck extension is deprecated in 0.140.0, so
      # `svc up --wait` is left to depend on jaeger's healthcheck and on the
      # canary's own retry loop instead. Stated, not assumed:
      # state/EP-1/T-008.md § Evidence 2.
      disable: true
    mem_limit: 192m
    cpus: 0.5

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    profiles: ['otel']
    networks: [kinvara-int]
    expose:
      - '4317' # OTLP gRPC — the collector exports here
      - '4318' # OTLP HTTP
      - '16686' # UI and query API
    mem_limit: 320m
    cpus: 0.5

  # =========================================================================
  # Application services.
  #
  # T-018 owns the Dockerfiles and compose.verify.yml, which adds the `build:`
  # stanza for each of these. Until then the images below do not exist and
  # `scripts/svc up <t> api` fails with "image not found" — loudly, and
  # correctly attributed. The service names, profiles, ports and budgets are
  # fixed HERE so every other ticket's `svc` declaration can be written now.
  #
  # DV-14 floor of 2 tasks applies to `worker` and `safety-gw` in the cloud
  # (T-014). Compose runs one replica of each locally; the floor is a
  # blast-radius decision about the deployed estate, encoded in Terraform.
  # =========================================================================
  core:
    image: kinvara/core:dev
    profiles: ['api']
    # Read by scripts/svc to name the ticket that builds this image, so a
    # missing one reports "not built yet" instead of Docker's own
    # "pull access denied ... may require 'docker login'" (QA-F8).
    labels:
      io.kinvara.built-by: 'T-018'
      io.kinvara.built-by-title: 'the application Dockerfiles + the verify overlay'
    networks: [kinvara-int]
    expose:
      - '3000'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://app:app_local_dev_only@postgres:5432/kinvara}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
      # T-139: the HIBP range-API stand-in (profile `hibp`). Declared here
      # because T-141's register route runs in this container and may not
      # edit this file (T-017 § contract 8).
      HIBP_API_BASE: ${HIBP_API_BASE:-http://hibp-fake:4100}
      # T-008. The collector is on profile `otel`. Left EMPTY (exporter on) by
      # default on purpose: without `otel`, every export fails and is counted
      # and printed (packages/observability/src/otlp.ts), and since T-204 that
      # costs dropped spans only. The exporter keeps one export in flight, a
      # 5 s deadline, a cool-down after a failure and a bounded buffer, so an
      # absent or blackholed collector cannot starve `core`'s name lookups and
      # switch off the HIBP check (OD-227; state/EP-1/T-204.md). Every `api`
      # run without `otel` exercises that degraded path, which is the point.
      # `true` makes the exporter a no-op; it is optional, not a safety switch.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_CORE:-kinvara-core}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-}
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 30s # SIGTERM must drain in-flight requests (T-018)

  worker:
    image: kinvara/worker:dev
    profiles: ['worker']
    # Read by scripts/svc to name the ticket that builds this image, so a
    # missing one reports "not built yet" instead of Docker's own
    # "pull access denied ... may require 'docker login'" (QA-F8).
    labels:
      io.kinvara.built-by: 'T-018'
      io.kinvara.built-by-title: 'the application Dockerfiles + the verify overlay'
    networks: [kinvara-int]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://app:app_local_dev_only@postgres:5432/kinvara}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s

  safety-gw:
    image: kinvara/safety-gw:dev
    profiles: ['safety']
    # Read by scripts/svc to name the ticket that builds this image, so a
    # missing one reports "not built yet" instead of Docker's own
    # "pull access denied ... may require 'docker login'" (QA-F8).
    labels:
      io.kinvara.built-by: 'T-018'
      io.kinvara.built-by-title: 'the application Dockerfiles + the verify overlay'
    networks: [kinvara-int]
    expose:
      - '3010'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 30s

  web:
    image: kinvara/web:dev
    profiles: ['web']
    # Read by scripts/svc to name the ticket that builds this image, so a
    # missing one reports "not built yet" instead of Docker's own
    # "pull access denied ... may require 'docker login'" (QA-F8).
    labels:
      io.kinvara.built-by: 'T-018'
      io.kinvara.built-by-title: 'the application Dockerfiles + the verify overlay'
    networks: [kinvara-int]
    expose:
      - '3001'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      CORE_BASE_URL: ${CORE_BASE_URL:-http://core:3000}
    mem_limit: 768m
    cpus: 1.5
    # PID 1 may wait GROUP_DRAIN_MS for the app's process group after SIGTERM;
    # gate:app-images §7 holds this above that wait, read from entrypoint.mjs (T-179).
    stop_grace_period: 30s

  admin:
    image: kinvara/admin:dev
    profiles: ['admin']
    # Read by scripts/svc to name the ticket that builds this image, so a
    # missing one reports "not built yet" instead of Docker's own
    # "pull access denied ... may require 'docker login'" (QA-F8).
    labels:
      io.kinvara.built-by: 'T-018'
      io.kinvara.built-by-title: 'the application Dockerfiles + the verify overlay'
    networks: [kinvara-int]
    expose:
      - '3002'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      CORE_BASE_URL: ${CORE_BASE_URL:-http://core:3000}
    mem_limit: 768m
    cpus: 1.5
    # PID 1 may wait GROUP_DRAIN_MS for the app's process group after SIGTERM;
    # gate:app-images §7 holds this above that wait, read from entrypoint.mjs (T-179).
    stop_grace_period: 30s
