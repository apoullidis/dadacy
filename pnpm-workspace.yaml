# Kinvara pnpm workspace (SD §DH-1, SA §TS-3).
#
# pnpm settings belong HERE and not in .npmrc: measured against pnpm 11.25.0,
# pnpm no longer reads its own settings from npmrc and ignores them silently
# (state/EP-1/T-000.md § Published contract, obligation 2). There is no
# .npmrc in this repository and none should be added.
#
# `storeDir` is deliberately NOT set. The toolbox exports
# pnpm_config_store_dir=/pnpm-store, a named Docker volume shared by every
# agent; overriding it here would put the store inside the bind-mounted tree.

packages:
  - 'apps/*'
  - 'packages/*'

# T-138. drizzle-kit (db:introspect, db:introspect:check) depends on esbuild, whose
# install script only validates the platform binary that pnpm already installs as the
# optional dependency @esbuild/<platform>. pnpm 11 refuses an install that leaves a
# build script undecided (ERR_PNPM_IGNORED_BUILDS), so the decision is recorded here:
# no dependency script runs.
allowBuilds:
  esbuild: false

# T-005, decisions.md OD-51. WITHOUT THIS LINE pnpm handles a package published
# inside its minimumReleaseAge window by writing an entry into
# `minimumReleaseAgeExclude` IN THIS FILE, printing one informational line, and
# EXITING 0 — leaving a supply-chain exemption that reads like configuration
# somebody chose. `minimumReleaseAgeStrict: true` is pnpm's own answer: it
# REFUSES the install instead. `pnpm gate:supply-chain` is the second half — it
# fails if this line is missing or false, and on any `minimumReleaseAgeExclude`
# entry, because a prevention nobody checks is a prevention that stops one day
# without saying so. The remedy for a too-new package is to PIN AN OLDER
# RELEASE (T-115 pinned vite 8.2.2 over the day-old 8.3.0), never an exemption.
minimumReleaseAgeStrict: true

# T-236, decisions.md OD-260. A SECURITY override, scoped to one edge.
# Every @nestjs/platform-fastify 11.2.x release up to and including 11.2.7
# (measured against the registry 2026-10-01) pins `fastify` EXACTLY at 5.11.3,
# which carries GHSA-p68q-wchp-6fh7, GHSA-hwr6-493r-vm6h, GHSA-9q9j-q6p8-xq58
# and GHSA-667r-xxjv-c9mm (all fixed in fastify 5.12.2). No Nest release fixes
# that pin, so the only upgrade route is this override; 5.12.5 is taken over
# 5.12.2 because its dependency ranges are identical and it also fixes the
# MODERATE GHSA-4mh8-r7rc-xpvc. It is scoped to the platform-fastify edge so it
# cannot move any other consumer of fastify.
# REMOVE IT when a @nestjs/platform-fastify release pins fastify >= 5.12.2:
# bump to that release, delete these lines, and `gate:trivy`/`gate:audit` must
# stay green.
overrides:
  '@nestjs/platform-fastify>fastify': 5.12.5
